<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KDS Kitchen Display - Frontpad Integration Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Удобно для TV, не мешает выделению */
        }

        body {
            background: #0a0f1e;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, 'Inter', sans-serif;
            padding: 24px;
            min-height: 100vh;
            color: #f0f3fa;
        }

        /* Основной контейнер дашборда */
        .dashboard {
            max-width: 1920px;
            margin: 0 auto;
        }

        /* Верхняя панель */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 32px;
            gap: 20px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            padding: 16px 24px;
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #7c9bff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .title p {
            font-size: 1rem;
            color: #a0b0d0;
            margin-top: 6px;
        }

        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #1e2a3a;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-family: inherit;
        }

        .btn-primary {
            background: #2c5f8a;
        }
        .btn-primary:hover {
            background: #3f7cae;
            transform: scale(1.02);
        }
        .btn-warning {
            background: #6b3e1f;
        }
        .btn-warning:hover {
            background: #8b5a2e;
        }
        .btn-sound {
            background: #2c4b3e;
        }
        .btn-sound.active {
            background: #2e7d64;
            box-shadow: 0 0 8px #2ecc71;
        }
        .status-badge {
            background: #11161f;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            border-left: 4px solid #ffaa44;
        }

        .last-update {
            font-size: 0.9rem;
            color: #b0c4ff;
            background: #00000055;
            padding: 8px 16px;
            border-radius: 32px;
        }

        /* Сетка карточек заказов */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
            gap: 28px;
            margin-top: 20px;
        }

        /* Карточка заказа */
        .order-card {
            background: #11161f;
            border-radius: 36px;
            padding: 24px 28px;
            transition: all 0.2s;
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.5);
            border-left: 8px solid;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(2px);
        }

        /* Цветовые классы по таймеру */
        .order-card.green {
            background: #0f2b1a;
            border-left-color: #2ecc71;
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.2);
        }
        .order-card.yellow {
            background: #3b2e0e;
            border-left-color: #f1c40f;
            box-shadow: 0 8px 20px rgba(241, 196, 15, 0.2);
        }
        .order-card.red {
            background: #3a1c1c;
            border-left-color: #e74c3c;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.25);
        }

        /* Верхняя часть карточки: номер + статус + время */
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 14px;
        }
        .order-number {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: #ffffff20;
            padding: 4px 14px;
            border-radius: 60px;
            display: inline-block;
        }
        .order-status {
            font-size: 1.2rem;
            font-weight: 600;
            background: #00000055;
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }
        .timer-badge {
            font-size: 1.3rem;
            font-weight: 700;
            background: #00000066;
            padding: 6px 16px;
            border-radius: 60px;
            font-family: monospace;
        }

        /* Список блюд */
        .items-list {
            margin: 8px 0;
            background: #00000030;
            border-radius: 28px;
            padding: 16px 20px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .item-name {
            font-weight: 500;
        }
        .item-qty {
            font-weight: 700;
            background: #ffffff20;
            padding: 2px 12px;
            border-radius: 50px;
        }
        .comment-section {
            background: #00000040;
            border-radius: 24px;
            padding: 12px 18px;
            margin-top: 6px;
        }
        .comment-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bbaa88;
        }
        .comment-text {
            font-size: 1.2rem;
            font-weight: 500;
            word-break: break-word;
            margin-top: 6px;
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: #0e121b;
            border-radius: 60px;
            font-size: 1.8rem;
            color: #7c8db0;
        }

        /* Тост-уведомления */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        .toast {
            background: #1e2a3aee;
            backdrop-filter: blur(12px);
            color: #ffdd99;
            padding: 16px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            border-left: 6px solid #f39c12;
            box-shadow: 0 10px 25px black;
            pointer-events: auto;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px);}
            to { opacity: 1; transform: translateX(0);}
        }

        /* адаптация для больших экранов TV (Full HD) */
        @media (min-width: 1600px) {
            .orders-grid {
                grid-template-columns: repeat(auto-fill, minmax(540px, 1fr));
                gap: 32px;
            }
            .order-number {
                font-size: 2.4rem;
            }
            .item-row {
                font-size: 1.5rem;
            }
            .comment-text {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }
            .orders-grid {
                grid-template-columns: 1fr;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg);}
        }
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #5f6f8a;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <div class="title">
            <h1>🍳 KDS Kitchen Display</h1>
            <p>Интеграция с Frontpad API | Активные заказы</p>
        </div>
        <div class="controls">
            <div class="status-badge" id="filterStatusBadge">🔄 Фильтр: Новый, Готовится</div>
            <button class="btn btn-primary" id="refreshBtn">⟳ Обновить сейчас</button>
            <button class="btn btn-sound" id="soundToggleBtn">🔇 Звук выкл</button>
            <div class="last-update" id="lastUpdateTime">—:—:—</div>
        </div>
    </div>

    <div id="ordersContainer" class="orders-grid">
        <div class="empty-state">⏳ Загрузка заказов...</div>
    </div>
    <footer>⏱️ Цвет карточки зависит от времени с момента создания заказа: 🔵 зелёный (<20мин) | 🟡 жёлтый (20-29мин) | 🔴 красный (≥30мин)</footer>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
    // ======================== КОНФИГУРАЦИЯ ========================
    const CONFIG = {
        // Режим: true - использовать мок-данные (демо без реального API), false - реальный запрос к API Frontpad
        mockMode: true,
        // URL метода get_orders (замените на реальный эндпоинт)
        apiUrl: 'https://demo.frontpad.ru/api/get_orders',  // пример
        apiKey: "",                         // ключ для авторизации (заполнить при подключении) (если требуется)
        // Интервал обновления заказов (миллисекунды) — 30 секунд для демо
        refreshIntervalMs: 30000,
        // Статусы, которые показываем на дашборде (названия из API Frontpad)
        allowedStatuses: ['Новый', 'Готовится'],
        // Интервал автоматического обновления цветов (без запроса API) — каждые 15 секунд для плавного тайминга
        colorRefreshIntervalMs: 15000,
    };

    // Глобальные переменные
    let currentOrders = [];            // последний полученный список заказов (сырые)
    let previousOrderIds = new Set();  // для отслеживания новых заказов
    let refreshTimer = null;
    let colorTimer = null;
    let soundEnabled = false;
    let audioContext = null;            // для звуковых уведомлений через Web Audio API
    let lastUpdateTimestamp = null;

    // DOM элементы
    const ordersContainer = document.getElementById('ordersContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const lastUpdateSpan = document.getElementById('lastUpdateTime');
    const filterBadge = document.getElementById('filterStatusBadge');

    // Вспомогательная функция: формат времени
    function formatTime(date) {
        return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute:'2-digit', second:'2-digit' });
    }

    // Обновление метки последнего обновления
    function updateLastUpdateLabel() {
        if (lastUpdateTimestamp) {
            lastUpdateSpan.innerText = `Обновлено: ${formatTime(lastUpdateTimestamp)}`;
        } else {
            lastUpdateSpan.innerText = '—:—:—';
        }
    }

    // ======================== ЗВУКОВОЕ ОПОВЕЩЕНИЕ ========================
    // Инициализация аудио контекста по действию пользователя
    async function initAudioContext() {
        if (audioContext) {
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            return audioContext;
        }
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
        return audioContext;
    }

    // Проигрывание короткого звукового сигнала (бип)
    async function playNotificationSound() {
        if (!soundEnabled) return;
        try {
            let ctx = audioContext;
            if (!ctx) {
                ctx = await initAudioContext();
                if (!ctx) return;
            }
            if (ctx.state !== 'running') {
                await ctx.resume();
            }
            const now = ctx.currentTime;
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.value = 880;
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.6);
            oscillator.start(now);
            oscillator.stop(now + 0.4);
        } catch (e) {
            console.warn("Звук не поддерживается или заблокирован:", e);
        }
    }

    // Включение/выключение звука с инициализацией
    async function toggleSound() {
        if (!soundEnabled) {
            try {
                await initAudioContext();
                soundEnabled = true;
                soundToggleBtn.innerHTML = '🔊 Звук вкл';
                soundToggleBtn.classList.add('active');
                // тестовый звук
                await playNotificationSound();
            } catch (err) {
                console.error("Не удалось активировать звук:", err);
                alert("Для работы звука необходимо разрешение браузера. Нажмите ещё раз после любого взаимодействия.");
                soundEnabled = false;
                soundToggleBtn.innerHTML = '🔇 Звук выкл';
                soundToggleBtn.classList.remove('active');
            }
        } else {
            soundEnabled = false;
            soundToggleBtn.innerHTML = '🔇 Звук выкл';
            soundToggleBtn.classList.remove('active');
            if (audioContext) {
                audioContext.suspend();
            }
        }
    }

    // Показать всплывающее уведомление (тост)
    function showToast(message, isNewOrder = true) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `🆕 ${message}`;
        container.appendChild(toast);
        if (soundEnabled && isNewOrder) {
            playNotificationSound();
        }
        setTimeout(() => {
            toast.remove();
        }, 4000);
    }

    // ======================== ЛОГИКА ОТОБРАЖЕНИЯ КАРТОЧЕК ========================
    // Вычисление прошедших минут от created_at
    function getMinutesPassed(createdAtStr) {
        const createdDate = new Date(createdAtStr);
        if (isNaN(createdDate)) return 0;
        const diffMs = Date.now() - createdDate.getTime();
        return Math.floor(diffMs / 60000);
    }

    // Получить класс цвета по минутам
    function getColorClass(minutes) {
        if (minutes < 20) return 'green';
        if (minutes < 30) return 'yellow';
        return 'red';
    }

    // Отрисовка заказов (фильтрация по статусам, цветовая индикация)
    function renderOrders(orders) {
        if (!orders || orders.length === 0) {
            ordersContainer.innerHTML = `<div class="empty-state">🍽️ Нет активных заказов (статусы: ${CONFIG.allowedStatuses.join(', ')})</div>`;
            return;
        }

        // фильтрация по разрешённым статусам
        const filtered = orders.filter(order => CONFIG.allowedStatuses.includes(order.status));
        if (filtered.length === 0) {
            ordersContainer.innerHTML = `<div class="empty-state">⏳ Нет заказов с фильтром (${CONFIG.allowedStatuses.join(', ')})</div>`;
            return;
        }

        // сортировка: сначала красные (критичные), потом по времени (чем старше - выше), затем по номеру
        const sorted = [...filtered].sort((a,b) => {
            const minsA = getMinutesPassed(a.created_at);
            const minsB = getMinutesPassed(b.created_at);
            if (minsA >= 30 && minsB < 30) return -1;
            if (minsB >= 30 && minsA < 30) return 1;
            if (minsA >= 20 && minsB < 20) return -1;
            if (minsB >= 20 && minsA < 20) return 1;
            return minsB - minsA; // чем дольше висит, тем выше
        });

        let html = '';
        for (const order of sorted) {
            const mins = getMinutesPassed(order.created_at);
            const colorClass = getColorClass(mins);
            // форматируем время для отображения
            const timeLabel = mins < 60 ? `${mins} мин` : `${Math.floor(mins/60)}ч ${mins%60}м`;
            
            // рендер позиций
            let itemsHtml = '';
            if (order.items && order.items.length) {
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="item-row">
                            <span class="item-name">${escapeHtml(item.name)}</span>
                            <span class="item-qty">× ${item.quantity}</span>
                        </div>
                    `;
                });
            } else {
                itemsHtml = '<div class="item-row">Нет позиций</div>';
            }

            // комментарий
            const commentHtml = order.comment ? `
                <div class="comment-section">
                    <div class="comment-label">📝 Комментарий</div>
                    <div class="comment-text">${escapeHtml(order.comment)}</div>
                </div>
            ` : '';

            html += `
                <div class="order-card ${colorClass}">
                    <div class="order-header">
                        <span class="order-number">Заказ №${escapeHtml(order.number)}</span>
                        <div style="display: flex; gap: 12px;">
                            <span class="order-status">${escapeHtml(order.status)}</span>
                            <span class="timer-badge">⏱️ ${timeLabel}</span>
                        </div>
                    </div>
                    <div class="items-list">
                        ${itemsHtml}
                    </div>
                    ${commentHtml}
                </div>
            `;
        }
        ordersContainer.innerHTML = html;
    }

    // вспомогательная защита от XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // ======================== ПОЛУЧЕНИЕ ДАННЫХ (API / MOCK) ========================
    // Генератор мок-заказов (реалистичное демо с динамическими изменениями)
    function generateMockOrders() {
        // Базовая статика + несколько "живых" заказов, чтобы показать уведомления
        const now = new Date();
        const mockBase = [
            {
                id: 101,
                number: "B-124",
                status: "Новый",
                created_at: new Date(now.getTime() - 6 * 60000).toISOString(), // 6 мин назад (зеленый)
                items: [{ name: "Цезарь с курицей", quantity: 2 }, { name: "Карбонара", quantity: 1 }],
                comment: "Без лука, соус отдельно"
            },
            {
                id: 102,
                number: "B-125",
                status: "Готовится",
                created_at: new Date(now.getTime() - 22 * 60000).toISOString(), // 22 мин (желтый)
                items: [{ name: "Говяжья отбивная", quantity: 1 }, { name: "Картофель фри", quantity: 2 }],
                comment: "Прожарка medium rare"
            },
            {
                id: 103,
                number: "B-126",
                status: "Новый",
                created_at: new Date(now.getTime() - 35 * 60000).toISOString(), // 35 мин (красный)
                items: [{ name: "Салат Греческий", quantity: 1 }, { name: "Лимонный тарт", quantity: 2 }],
                comment: "Добавить оливки"
            },
            {
                id: 104,
                number: "B-127",
                status: "Готовится",
                created_at: new Date(now.getTime() - 12 * 60000).toISOString(), // 12 мин (зеленый)
                items: [{ name: "Суп Том Ям", quantity: 1 }, { name: "Рис", quantity: 1 }],
                comment: ""
            },
            {
                id: 105,
                number: "B-128",
                status: "Доставлен", // не попадает в фильтр
                created_at: new Date(now.getTime() - 45 * 60000).toISOString(),
                items: [{ name: "Чизкейк", quantity: 1 }],
                comment: "Не показывается (статус не в фильтре)"
            }
        ];

        // Добавляем иногда новый заказ, чтобы продемонстрировать уведомление (динамика)
        // Для имитации изменений будем добавлять заказ с вероятностью 35% при каждом вызове (но не чаще, чем уникальный)
        // Но чтобы не плодить бесконечно, используем статический массив с возможностью добавить новый "свежий" заказ
        // В демо-режиме сделаем копию, и если в последнем обновлении нет свежего, добавим один тестовый с новым id
        // Но для стабильности: с каждым вызовом можем добавлять заказ с новым id на 0-2 минуты назад
        const freshId = 200 + Math.floor(Math.random() * 500);
        const alreadyHasFresh = mockBase.some(o => o.id === freshId);
        if (!alreadyHasFresh && Math.random() > 0.6) {
            const freshMinutesAgo = Math.floor(Math.random() * 4); // 0-3 минуты назад
            const newOrder = {
                id: freshId,
                number: `NEW-${freshId}`,
                status: "Новый",
                created_at: new Date(now.getTime() - freshMinutesAgo * 60000).toISOString(),
                items: [{ name: "🔥 Новое блюдо: Стейк Рибай", quantity: 1 }, { name: "Овощи гриль", quantity: 1 }],
                comment: "Срочно! Гость торопится"
            };
            mockBase.push(newOrder);
        }

        // удаляем слишком старые за注азы, которые могли бы засорять (более 2 часов), но необязательно
        return mockBase.filter(order => {
            const orderDate = new Date(order.created_at);
            const diffHours = (now - orderDate) / (1000*3600);
            return diffHours < 2.5;
        });
    }

    // Имитация или реальный запрос к API Frontpad
    async function fetchOrdersFromAPI() {
        if (CONFIG.mockMode) {
            // Имитация задержки сети
            await new Promise(resolve => setTimeout(resolve, 400));
            const mockOrders = generateMockOrders();
            console.log("[MOCK] Получено заказов:", mockOrders.length);
            return mockOrders;
        } else {
            // РЕАЛЬНЫЙ API-ЗАПРОС (пример структуры для Frontpad)
            try {
                const response = await fetch(CONFIG.apiUrl, {
                    method: 'POST', // или GET, зависит от документации Frontpad
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${CONFIG.apiKey}`
                    },
                    body: JSON.stringify({}) // параметры get_orders
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                // предполагаем, что ответ содержит массив заказов в поле orders
                // адаптируйте под реальную структуру API Frontpad
                if (data && data.orders) return data.orders;
                else return [];
            } catch (error) {
                console.error("Ошибка запроса к API Frontpad:", error);
                showToast("⚠️ Ошибка загрузки данных с API", false);
                return currentOrders; // возвращаем старые данные при ошибке
            }
        }
    }

    // Основная загрузка и сравнение новых заказов
    async function loadOrders(showLoadingState = true) {
        if (showLoadingState && (!currentOrders || currentOrders.length === 0)) {
            ordersContainer.innerHTML = `<div class="empty-state"><span class="loading-spinner"></span> Загрузка заказов...</div>`;
        }
        try {
            const newOrders = await fetchOrdersFromAPI();
            if (!newOrders) return;

            // Определяем новые заказы (по id)
            const newOrderIds = new Set(newOrders.map(o => o.id));
            const addedOrders = newOrders.filter(o => !previousOrderIds.has(o.id));
            
            // Если появились новые заказы
            if (addedOrders.length > 0) {
                for (const newOrder of addedOrders) {
                    if (CONFIG.allowedStatuses.includes(newOrder.status)) {
                        showToast(`Заказ №${newOrder.number} (${newOrder.status})`, true);
                    }
                }
            }
            
            // Обновляем кэш
            currentOrders = [...newOrders];
            previousOrderIds = newOrderIds;
            lastUpdateTimestamp = new Date();
            updateLastUpdateLabel();
            
            // Рендер с фильтрацией
            renderOrders(currentOrders);
        } catch (err) {
            console.error("loadOrders error:", err);
            ordersContainer.innerHTML = `<div class="empty-state">❌ Ошибка загрузки данных. Проверьте консоль.</div>`;
        }
    }

    // Принудительное обновление цветов (без повторной загрузки API)
    function refreshColorsOnly() {
        if (currentOrders && currentOrders.length > 0) {
            renderOrders(currentOrders);
        }
    }

    // ======================== ИНИЦИАЛИЗАЦИЯ И АВТООБНОВЛЕНИЯ ========================
    function startAutoRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        if (colorTimer) clearInterval(colorTimer);
        
        refreshTimer = setInterval(() => {
            loadOrders(false);
        }, CONFIG.refreshIntervalMs);
        
        colorTimer = setInterval(() => {
            refreshColorsOnly();
        }, CONFIG.colorRefreshIntervalMs);
    }

    function stopAutoRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        if (colorTimer) clearInterval(colorTimer);
        refreshTimer = null;
        colorTimer = null;
    }

    // ручное обновление
    async function manualRefresh() {
        await loadOrders(true);
    }

    // Настройка UI и подписки
    function setupEventListeners() {
        refreshBtn.addEventListener('click', () => manualRefresh());
        soundToggleBtn.addEventListener('click', toggleSound);
        filterBadge.innerHTML = `🎯 Фильтр: ${CONFIG.allowedStatuses.join(', ')}`;
    }

    // Запуск приложения
    async function init() {
        setupEventListeners();
        await loadOrders(true);
        startAutoRefresh();
        // также каждые 30 секунд проверяем цветовое обновление дополнительно
    }

    init();
</script>
</body>
</html>
